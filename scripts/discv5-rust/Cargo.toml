[package]
name = "discv5-rust"
version = "0.1.0"
edition = "2021"
publish = false
description = "discv5 interop helper: Lighthouse's discv5 crate against the leanp2p node"

# The crate and version Lighthouse runs (lighthouse Cargo.lock).
[dependencies]
discv5 = "=0.12.0"
# The enr crate discv5 0.12.0 builds on, with its features.
enr = { version = "0.14.0", features = ["k256", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[workspace]
